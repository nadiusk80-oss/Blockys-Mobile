name: Blockys Móvil CI

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'
      - 'blockys/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK components
        run: |
          set -eu
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-37" "ndk;27.3.13750724" >/dev/null

      - name: Get JRE 8 binpack
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '9.6.1'

      - name: Apply Blockys branding
        run: |
          python3 -m pip install --quiet pillow
          python3 blockys/brand.py

      - name: Prepare resources
        run: |
          chmod +x scripts/*.sh gradlew
          ./scripts/languagelist_updater.sh

      - name: Build debug APK
        run: gradle :app_pojavlauncher:assembleDebug --no-daemon

      - name: Verify APK
        run: |
          set -eu
          apk=app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk
          cp "$apk" Blockys-Movil-2.0.0.apk
          ls -l Blockys-Movil-2.0.0.apk
          aapt=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          "$aapt" dump badging Blockys-Movil-2.0.0.apk | head -3
          echo "jre entries: $(unzip -l Blockys-Movil-2.0.0.apk | grep -c 'assets/components/jre/')"
          unzip -l Blockys-Movil-2.0.0.apk | grep -E 'assets/components/jre/(universal|bin-arm64)\.tar\.xz'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blockys-apk
          path: Blockys-Movil-2.0.0.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: blockys-mobile-v2.0.0
          name: Blockys Móvil 2.0.0
          make_latest: true
          files: Blockys-Movil-2.0.0.apk
          body: |
            ## Blockys Móvil 2.0.0

            Nueva base: [Amethyst-Android](https://github.com/AngelAuraMC/Amethyst-Android) (LGPL-3.0),
            a su vez un fork de PojavLauncher.

            - Soporta Minecraft hasta 26.3 y 26.4-snapshot (Java 25).
            - Incluye Java 8; Java 17, 21 y 25 se instalan desde Ajustes > Java o
              automáticamente al iniciar una versión que las necesite.
            - Paquete propio com.blockys.movil, nombre, iconos y color de Blockys.
            - APK firmada con la clave de depuración del proyecto; instalar con
              orígenes desconocidos habilitados.

            Licencia LGPL-3.0. Este fork no está afiliado a AngelAuraMC, PojavLauncherTeam,
            Mojang ni Microsoft. El código modificado está publicado en este repositorio.
