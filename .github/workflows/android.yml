name: Blockys Mobile CI

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'
      - 'blockys/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Get JRE 8 binpack
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '9.6.1'

      - name: Apply Blockys branding
        run: |
          python3 -m pip install --quiet pillow
          python3 blockys/brand.py

      - name: Prepare resources
        run: |
          chmod +x scripts/*.sh gradlew
          ./scripts/languagelist_updater.sh

      - name: Build debug APK
        run: gradle :app_pojavlauncher:assembleDebug --no-daemon

      - name: Verify APK
        run: |
          set -eu
          apk=app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk
          cp "$apk" Blockys-Mobile-2.0.8.apk
          ls -l Blockys-Mobile-2.0.8.apk
          aapt=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          "$aapt" dump badging Blockys-Mobile-2.0.8.apk | head -3
          echo "jre entries: $(unzip -l Blockys-Mobile-2.0.8.apk | grep -c 'assets/components/jre/')"
          unzip -l Blockys-Mobile-2.0.8.apk | grep -E 'assets/components/jre/(universal|bin-arm64)\.tar\.xz'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blockys-apk
          path: Blockys-Mobile-2.0.8.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: blockys-mobile-v2.0.8
          name: Blockys Mobile 2.0.8
          make_latest: true
          files: Blockys-Mobile-2.0.8.apk
          body: |
            ## Blockys Mobile 2.0.8

            - New: when Minecraft 26.x closes because the Zink renderer cannot start on this
              device, Blockys Mobile now moves that profile to MobileGlues by itself. The
              first attempt still ends with code 6, but the launcher recognises
              "Could not initialize EGL" in latestlog.txt, saves the MobileGlues renderer in
              the profile and tells you to press Play again. The next launch starts with
              MobileGlues, no settings change needed.
            - Profiles that need Java 25 only get the Vulkan-backed Kopper Zink renderer when
              they have no renderer of their own. An explicit choice, including the one the
              fallback saves, is never overridden.
            - 2.0.8's repairs are kept: the SDL EGL load is retried through the launcher's
              loader when the plain dlopen is refused, and extra SDL windows reuse the one
              Android allows. The OpenGL fallback remains experimental.
            - Fix: the launcher writes `fullscreen:false` into `options.txt`.
            - Local (offline) accounts and version downloads work without a Microsoft
              account.
            - Runs Minecraft versions up to 26.3 and 26.4-snapshot (Java 25).
            - Bundles Java 8; Java 17, 21 and 25 install from Settings > Java or download
              automatically when a version requires them.
            - Own package com.blockys.movil, Blockys name, icons and accent color.
            - APK signed with the project debug key; install with unknown sources enabled.
              Uninstall any previous Blockys Mobile build first: each build uses a new debug
              signature, so it cannot update an older one in place.

            Based on [Amethyst-Android](https://github.com/AngelAuraMC/Amethyst-Android) (LGPL-3.0),
            itself a fork of PojavLauncher. This fork is not affiliated with AngelAuraMC,
            PojavLauncherTeam, Mojang or Microsoft. Modified source is published in this repository.
